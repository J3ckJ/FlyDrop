name: Pult Windows

on:
  push:
    branches:
      - cursor/pult-iphone-remote-3490
  pull_request:

jobs:
  exe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pult
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Test the protocol and the server on Linux
        run: go test ./...
      - name: Cross-compile pult.exe
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/pult.exe ./win/cmd/pult
      - uses: actions/upload-artifact@v4
        with:
          name: pult-windows-amd64
          path: pult/dist/pult.exe
          if-no-files-found: error

  # Run the unsigned exe on a clean Windows runner. A crash fails this job.
  # PULT_SELFTEST_NO_PAUSE stops a runner whose console process count is 1
  # from waiting for Enter.
  selftest:
    needs: exe
    runs-on: windows-latest
    env:
      PULT_SELFTEST_NO_PAUSE: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pult-windows-amd64
      - name: Self-test pult.exe
        shell: pwsh
        run: |
          & .\pult.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $blob = ""
          foreach ($path in @(
            (Join-Path $env:LOCALAPPDATA "Pult\pult.log"),
            (Join-Path (Get-Location) "pult.log")
          )) {
            if (Test-Path $path) {
              Write-Host "---- $path"
              Get-Content $path -Tail 120
              $blob += Get-Content $path -Raw
            }
          }
          if ($blob -notmatch "PULT_SELFTEST_OK") {
            Write-Host "self-test log has no success line"
            exit 1
          }

  # secrets are not allowed in a job-level if. That expression rejects the whole
  # workflow before exe starts, so the unsigned artifact never appears.
  # The certificate is mapped into the job environment and checked on each step.
  sign:
    needs: exe
    runs-on: windows-latest
    env:
      PULT_CERT_PFX: ${{ secrets.PULT_CERT_PFX }}
      PULT_CERT_PASSWORD: ${{ secrets.PULT_CERT_PASSWORD }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.PULT_CERT_PFX != ''
        with:
          name: pult-windows-amd64
      - name: Sign pult.exe
        if: env.PULT_CERT_PFX != ''
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PULT_CERT_PFX)) { exit 0 }
          $bytes = [Convert]::FromBase64String($env:PULT_CERT_PFX)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\pult.pfx", $bytes)
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\pult.pfx" /p "$env:PULT_CERT_PASSWORD" .\pult.exe
      - uses: actions/upload-artifact@v4
        if: env.PULT_CERT_PFX != ''
        with:
          name: pult-windows-amd64-signed
          path: pult.exe
          if-no-files-found: error
